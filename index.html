<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dario Quintero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="site-name"><img src="assets/images/logo.webp" alt="Dario Quintero"></a>
    <nav>
      <a href="index.html"><img src="assets/images/home.webp" alt="Home"></a>
      <a href="works.html"><img src="assets/images/work.webp" alt="Work"></a>
      <a href="cv.html"><img src="assets/images/cv.webp" alt="CV"></a>
      <a data-email><img src="assets/images/contact.webp" alt="Contact"></a>
    </nav>
  </header>


  <main class="home">
    <!-- Left: intro text and photo -->
    <div class="intro-text">
      <p>I'm Dario. I am a senior at Carnegie Mellon University pursuing a degree in Computer Science and Fine Art. I make art and write code.</p>
      <p>Instagram: <em>dario.r.quintero</em></p>
      <p>Email: <em>dario.r.quintero@gmail.com</em></p>
      <img class="intro-portrait" src="assets/images/portrait-2.webp" alt="Dario Quintero">
    </div>

    <!-- Right: scratch-off splash. Change data-rows / data-cols to change
         the grid of works hidden underneath. It shows a random set of
         (rows x cols) works from js/works.js on every load. -->
    <div class="splash">
      <div class="scratcher" data-rows="2" data-cols="3">
        <div class="scratch-grid"></div>
        <canvas class="scratch-cover grabbable" aria-label="Scratch to reveal works"></canvas>
      </div>
    </div>
  </main>

  <script src="js/works.js"></script>
  <script src="js/scratcher.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
