<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="style.css">

<body class="work-page">

  <header class="site-header">
    <a href="index.html" class="site-name">Dario Quintero</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="works.html">Work</a>
      <a data-email>Contact</a>
    </nav>

  <!-- One page for every work. js/work.js fills this in based on the
       ?id= in the address, e.g. work.html?id=plant-matter

       Left: back link, the work's text, prev/next.
       Right: the work's images and videos, large. -->
  <main class="work-layout">

    <aside class="work-side">
      <a href="works.html" class="work-back">← Back to artworks</a>

      <div id="work-text" class="work-text"></div>

      <nav id="work-prevnext" class="work-prevnext"></nav>
    </aside>

    <section id="work-media" class="work-media"></section>

  </main>

  <script src="js/works.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/work.js"></script>

  <script src="js/editor.js"></script>
  <script src="js/site.js"></script>
