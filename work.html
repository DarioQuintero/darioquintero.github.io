<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dario Quintero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="work-page">

  <header class="site-header">
    <a href="index.html" class="site-name"><img src="assets/images/logo.webp" alt="Dario Quintero"></a>
    <nav>
      <a href="index.html"><img src="assets/images/home.webp" alt="Home"></a>
      <a href="works.html"><img src="assets/images/work.webp" alt="Work"></a>
      <a href="cv.html"><img src="assets/images/cv.webp" alt="CV"></a>
      <a data-email><img src="assets/images/contact.webp" alt="Contact"></a>
    </nav>
  </header>

  <!-- One page for every work. js/work.js fills this in based on the
       ?id= in the address, e.g. work.html?id=plant-matter

       Left: back link, the work's text, prev/next.
       Right: the work's images and videos, large. -->
  <main class="work-layout">

    <aside class="work-side">
      <a href="works.html" class="work-back">← Back to work</a>

      <div id="work-text" class="work-text"></div>

      <nav id="work-prevnext" class="work-prevnext"></nav>
    </aside>

    <section id="work-media" class="work-media"></section>

  </main>

  <script src="js/works.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/work.js"></script>
  <!-- The page editor: only switches on when running python tools/edit.py -->
  <script src="js/editor.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
